name: Build Kernel with KernelSU

on:
  workflow_dispatch: 
  push:
    branches:
      - '16.0'

permissions:
    contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 1. Checkout Kernel Source Code
      uses: actions/checkout@v4

    - name: 2. Inject KernelSU Next (Legacy Non-GKI)
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        
        python3 - <<'PY'
        from pathlib import Path

        p = Path("drivers/kernelsu/feature/selinux_hide.c")
        s = p.read_text()

        old = """#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        #endif
        """

        if old not in s:
          raise SystemExit("ksu_input_hook declaration pattern not found")

        s = s.replace(old, new, 1)

        old = """\twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        \twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        #endif
        """

        if old not in s:
          raise SystemExit("ksu_input_hook wait pattern not found")

        s = s.replace(old, new, 1)

        p.write_text(s)
        PY

    - name: 3. Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev make zip
    
    - name: 4. Download Compiler (Proton Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang

    - name: 5. Configure & Build the Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        DEFCONFIG: moonstone_defconfig 
        PATH: ${{ github.workspace }}/proton-clang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        KCFLAGS: "-march=armv8.2-a"
      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang $DEFCONFIG

        scripts/config --file out/.config -e KPROBES
        scripts/config --file out/.config -e KPROBE_EVENTS
        scripts/config --file out/.config -e KSU_KPROBES_HOOK
        scripts/config --file out/.config -e KSU
        scripts/config --file out/.config -e INPUT
        scripts/config --file out/.config -e KALLSYMS
        scripts/config --file out/.config -e KALLSYMS_ALL
        scripts/config --file out/.config -e OVERLAY_FS
        scripts/config --file out/.config -e TMPFS_XATTR
        scripts/config --file out/.config -e TMPFS_POSIX_ACL

        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang olddefconfig

        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTLD=/usr/bin/ld

    - name: 6. Package with AnyKernel3
      run: |
        git clone https://github.com/Gu11e/AnyKernel3-POCOX5.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        
        ZIP_MSG="Kernel moonstone with KernelSU-Next by ${{ github.actor }}"
        sed -i "s/kernel.string=.*/kernel.string=$ZIP_MSG/g" anykernel.sh
        
        zip -r9 ../Kernel-KSU-POCOX5.zip * -x .git README.md *placeholder

    - name: 7. Validate ZIP
      run: |
          test -f POCOX5-KernelSU-Next.zip

          echo "===== ZIP CONTENTS ====="
          unzip -l POCOX5-KernelSU-Next.zip

          echo "===== ZIP TEST ====="
          unzip -t POCOX5-KernelSU-Next.zip

          echo "===== REQUIRED FILES ====="
          unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "Image"
          unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "anykernel.sh"

    - name: 8. Generate Build Version
      id: version
      run: |
          BUILD_DATE="$(git show -s --date=format:'%Y.%m.%d' --format='%cd' HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="v${BUILD_DATE}-${SHORT_SHA}"

          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Version: ${VERSION}"
          echo "Commit:  $(git rev-parse HEAD)"

    - name: 9. Rename Release Files
      run: |
          mv POCOX5-KernelSU-Next.zip "POCOX5-KernelSU-Next-${VERSION}.zip"

          sha256sum "POCOX5-KernelSU-Next-${VERSION}.zip" > "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

          echo "===== SHA256 ====="
          cat "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

    - name: 10. Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "POCOX5-KernelSU-Next-${{ env.VERSION }}"
        path: |
            POCOX5-KernelSU-Next-${{ env.VERSION }}.zip
            POCOX5-KernelSU-Next-${{ env.VERSION }}.zip.sha256
            retention-days: 14

    - name: 11. Create GitHub Release
      if: github.event_name == 'push'
      env:
          GH_TOKEN: ${{ github.token }}
      run: |
          gh release create "${VERSION}" \
            "POCOX5-KernelSU-Next-${VERSION}.zip" \
            "POCOX5-KernelSU-Next-${VERSION}.zip.sha256" \
            --target "${GITHUB_SHA}" \
            --title "POCO X5 KernelSU-Next ${VERSION}" \
            --notes "Automated kernel build.

          Device: POCO X5 5G (moonstone)
          KernelSU-Next: legacy / Kprobes
          Commit: ${GITHUB_SHA}

          SHA-256:
          $(cat "POCOX5-KernelSU-Next-${VERSION}.zip.sha256")"
