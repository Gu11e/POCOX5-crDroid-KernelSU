name: Build Kernel with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches:
      - '16.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Kernel Source Code
      uses: actions/checkout@v4

    - name: 2. Inject KernelSU Next (Legacy Manual Hooks)
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -s legacy

    - name: 3. Apply KernelSU Next Manual Hooks
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        def patch(path, pattern, replacement, name, count=1):
            p = Path(path)
            text = p.read_text()

            new, n = re.subn(
                pattern,
                replacement,
                text,
                count=count,
                flags=re.MULTILINE | re.DOTALL,
            )

            if n != count:
                raise SystemExit(
                    f"[ERROR] {path}: {name}: expected {count} match(es), got {n}"
                )

            p.write_text(new)
            print(f"[OK] {path}: {name}")

        patch(
            "fs/exec.c",
            r'(int do_execve\(struct filename \*filename,\s*'
            r'const char __user \*const __user \*__argv,\s*'
            r'const char __user \*const __user \*__envp\)\s*'
            r'\{\s*'
            r'struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};\s*'
            r'struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
                ksu_handle_execveat((int *)AT_FDCWD, &filename,
                        &argv, &envp, NULL);
        #endif''',
            "do_execve hook",
        )

        patch(
            "fs/exec.c",
            r'(static int compat_do_execve\(struct filename \*filename,\s*'
            r'const compat_uptr_t __user \*__argv,\s*'
            r'const compat_uptr_t __user \*__envp\)\s*'
            r'\{\s*'
            r'struct user_arg_ptr argv = \{\s*'
            r'\.is_compat = true,\s*'
            r'\.ptr\.compat = __argv,\s*'
            r'\};\s*'
            r'struct user_arg_ptr envp = \{\s*'
            r'\.is_compat = true,\s*'
            r'\.ptr\.compat = __envp,\s*'
            r'\};)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
                ksu_handle_execveat((int *)AT_FDCWD, &filename,
                        &argv, &envp, NULL);
        #endif''',
            "compat_do_execve hook",
        )

        patch(
            "fs/exec.c",
            r'(#include <linux/tracehook\.h>\n)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
        __attribute__((hot))
        extern int ksu_handle_execveat(
                int *fd,
                struct filename **filename_ptr,
                void *argv,
                void *envp,
                int *flags
        );
        #endif
        ''',
            "execve declaration",
        )

        patch(
            "fs/open.c",
            r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\{\s*)'
            r'(return do_faccessat\(dfd, filename, mode\);\s*)'
            r'(\})',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
                ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
        #endif
                \2\3''',
            "faccessat hook",
        )

        patch(
            "fs/open.c",
            r'(#include "internal\.h"\n)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
        __attribute__((hot))
        extern int ksu_handle_faccessat(
                int *dfd,
                const char __user **filename_user,
                int *mode,
                int *flags
        );
        #endif
        ''',
            "faccessat declaration",
        )

        patch(
            "fs/read_write.c",
            r'(SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\s*\{\s*)'
            r'(return ksys_read\(fd, buf, count\);\s*)'
            r'(\})',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
                if (unlikely(ksu_init_rc_hook))
                        ksu_handle_sys_read(fd, &buf, &count);
        #endif
                \2\3''',
            "read hook",
        )

        patch(
            "fs/read_write.c",
            r'(#include <linux/uio\.h>\n)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
        extern bool ksu_init_rc_hook __read_mostly;
        extern __attribute__((cold)) int ksu_handle_sys_read(
                unsigned int fd,
                char __user **buf_ptr,
                size_t *count_ptr
        );
        #endif
        ''',
            "read declaration",
        )

        patch(
            "fs/stat.c",
            r'(SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,\s*'
            r'struct stat __user \*, statbuf, int, flag\)\s*\{\s*'
            r'struct kstat stat;\s*'
            r'int error;\s*)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
                ksu_handle_stat(&dfd, &filename, &flag);
        #endif''',
            "newfstatat hook",
        )

        patch(
            "fs/stat.c",
            r'(#include <linux/syscalls\.h>\n)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
        __attribute__((hot))
        extern int ksu_handle_stat(
                int *dfd,
                const char __user **filename_user,
                int *flags
        );
        #endif
        ''',
            "stat declaration",
        )

        patch(
            "kernel/reboot.c",
            r'(SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,\s*'
            r'void __user \*, arg\)\s*\{\s*'
            r'struct pid_namespace \*pid_ns = task_active_pid_ns\(current\);\s*'
            r'char buffer\[256\];\s*'
            r'int ret = 0;)',
            r'''\1

        #ifdef CONFIG_KSU_MANUAL_HOOK
                ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
        #endif''',
            "reboot hook",
        )

        patch(
            "kernel/reboot.c",
            r'(#include <linux/reboot\.h>\n)',
            r'''\1
        #ifdef CONFIG_KSU_MANUAL_HOOK
        extern int ksu_handle_sys_reboot(
                int magic1,
                int magic2,
                unsigned int cmd,
                void __user **arg
        );
        #endif
        ''',
            "reboot declaration",
        )

        print("All KernelSU Next manual hooks applied successfully.")
        PY

    - name: 4. Patch KernelSU SELinux Hide Compatibility
      run: |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("drivers/kernelsu/feature/selinux_hide.c")
        s = p.read_text()

        old = """#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        #endif
        """

        if old not in s:
            raise SystemExit(
                "ERROR: ksu_input_hook declaration pattern not found"
            )

        s = s.replace(old, new, 1)

        old = """\twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        \twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        #endif
        """

        if old not in s:
            raise SystemExit(
                "ERROR: ksu_input_hook wait pattern not found"
            )

        s = s.replace(old, new, 1)

        p.write_text(s)
        PY

    - name: 5. Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev make zip unzip

    - name: 6. Download Compiler (Proton Clang)
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git \
          proton-clang

    - name: 7. Configure & Build the Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        DEFCONFIG: moonstone_defconfig
        PATH: ${{ github.workspace }}/proton-clang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        KCFLAGS: "-march=armv8.2-a -O2"

      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 $DEFCONFIG

        scripts/config --file out/.config -e KSU
        scripts/config --file out/.config -e KSU_MANUAL_HOOK
        scripts/config --file out/.config -d KSU_KPROBES_HOOK
        scripts/config --file out/.config -d KSU_KPROBE_HOOKS
        scripts/config --file out/.config -d KPROBES
        scripts/config --file out/.config -d KPROBE_EVENTS

        scripts/config --file out/.config -e INPUT
        scripts/config --file out/.config -e KALLSYMS
        scripts/config --file out/.config -e KALLSYMS_ALL
        scripts/config --file out/.config -e OVERLAY_FS
        scripts/config --file out/.config -e TMPFS_XATTR
        scripts/config --file out/.config -e TMPFS_POSIX_ACL
        scripts/config --file out/.config -e LTO_CLANG_THIN
        scripts/config --file out/.config -d LTO_CLANG_FULL
        scripts/config --file out/.config -d LTO_NONE

        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 olddefconfig

        echo "===== KernelSU configuration ====="

        grep -E \
          '^(CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_KPROBE_HOOKS|CONFIG_OVERLAY_FS|CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL)=' \
          out/.config || true

        if ! grep -q '^CONFIG_KSU=y$' out/.config; then
          echo "ERROR: CONFIG_KSU=y was not enabled."
          exit 1
        fi

        if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config; then
          echo "ERROR: CONFIG_KSU_MANUAL_HOOK=y was not enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KPROBES=y$' out/.config; then
          echo "ERROR: CONFIG_KPROBES is still enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KPROBE_EVENTS=y$' out/.config; then
          echo "ERROR: CONFIG_KPROBE_EVENTS is still enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config; then
          echo "ERROR: CONFIG_KSU_KPROBES_HOOK is still enabled."
          exit 1
        fi

        echo "===== Manual hooks ====="

        grep -RnsE \
          'ksu_handle_execveat|ksu_handle_faccessat|ksu_handle_sys_read|ksu_handle_stat|ksu_handle_sys_reboot' \
          fs/exec.c \
          fs/open.c \
          fs/read_write.c \
          fs/stat.c \
          kernel/reboot.c

        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

    - name: 8. Package with AnyKernel3
      run: |
        git clone \
          https://github.com/Gu11e/AnyKernel3-POCOX5.git \
          AnyKernel3

        cp out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3

        ZIP_MSG="Kernel moonstone with KernelSU-Next Manual Hooks by ${{ github.actor }}"

        sed -i \
          "s/kernel.string=.*/kernel.string=$ZIP_MSG/g" \
          anykernel.sh

        if ! grep -q '^device.name2=gemstone$' anykernel.sh; then
          sed -i \
            '/^device.name1=moonstone$/a device.name2=gemstone' \
            anykernel.sh
        fi

        zip -r9 \
          ../POCOX5-KernelSU-Next.zip \
          * \
          -x .git README.md *placeholder

    - name: 9. Validate ZIP
      run: |
        test -f POCOX5-KernelSU-Next.zip

        unzip -l POCOX5-KernelSU-Next.zip
        unzip -t POCOX5-KernelSU-Next.zip

        unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "Image"
        unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "anykernel.sh"

        unzip -p POCOX5-KernelSU-Next.zip anykernel.sh | grep -E '^device.name[0-9]*=|^do.devicecheck='

    - name: 10. Generate Build Version
      id: version
      run: |
        BUILD_DATE="$(git show -s --date=format:'%Y.%m.%d' --format='%cd' HEAD)"
        SHORT_SHA="$(git rev-parse --short=7 HEAD)"
        VERSION="v${BUILD_DATE}-${SHORT_SHA}"

        echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
        echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

        echo "Version: ${VERSION}"
        echo "Commit:  $(git rev-parse HEAD)"

    - name: 11. Rename Release Files
      run: |
        mv \
          POCOX5-KernelSU-Next.zip \
          "POCOX5-KernelSU-Next-${VERSION}.zip"

        sha256sum \
          "POCOX5-KernelSU-Next-${VERSION}.zip" \
          > "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

        cat \
          "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

    - name: 12. Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "POCOX5-KernelSU-Next-${{ env.VERSION }}"
        path: |
          POCOX5-KernelSU-Next-${{ env.VERSION }}.zip
          POCOX5-KernelSU-Next-${{ env.VERSION }}.zip.sha256
        retention-days: 14

    - name: 13. Create GitHub Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}

      run: |
        gh release create "${VERSION}" \
          "POCOX5-KernelSU-Next-${VERSION}.zip" \
          "POCOX5-KernelSU-Next-${VERSION}.zip.sha256" \
          --target "${GITHUB_SHA}" \
          --title "POCO X5 KernelSU-Next ${VERSION}" \
          --notes "Automated kernel build.

        Device: POCO X5 5G (moonstone)
        KernelSU-Next: legacy / manual hooks
        Kprobes: disabled
        crDroid Recovery codename: gemstone
        Commit: ${GITHUB_SHA}

        SHA-256:
        $(cat "POCOX5-KernelSU-Next-${VERSION}.zip.sha256")"
