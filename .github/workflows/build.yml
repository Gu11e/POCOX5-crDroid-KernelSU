name: Build Kernel with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches:
      - '16.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Kernel Source Code
      uses: actions/checkout@v4

    - name: 2. Inject KernelSU Next (Legacy Manual Hooks)
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -s legacy

    - name: 3. Apply KernelSU Next Manual Hooks
      run: |
        sudo apt-get update
        sudo apt-get install -y coccinelle

        git clone --depth=1 \
          https://github.com/devnoname120/kernelsu-coccinelle.git \
          kernelsu-coccinelle

        cd kernelsu-coccinelle/scope-minimized-hooks
        ./apply.sh "$GITHUB_WORKSPACE"

    - name: 4. Patch KernelSU SELinux Hide Compatibility
      run: |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("drivers/kernelsu/feature/selinux_hide.c")
        s = p.read_text()

        old = """#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)
        extern bool ksu_input_hook __read_mostly __attribute__((weak));
        #else
        extern bool ksu_input_hook __read_mostly;
        #endif
        #endif
        """

        if old not in s:
            raise SystemExit(
                "ERROR: ksu_input_hook declaration pattern not found"
            )

        s = s.replace(old, new, 1)

        old = """\twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        """

        new = """#ifndef CONFIG_KSU_KPROBES_HOOK
        \twhile (READ_ONCE(ksu_input_hook))
        \t\tmsleep(5000);
        #endif
        """

        if old not in s:
            raise SystemExit(
                "ERROR: ksu_input_hook wait pattern not found"
            )

        s = s.replace(old, new, 1)

        p.write_text(s)
        PY

    - name: 5. Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev make zip unzip

    - name: 6. Download Compiler (Proton Clang)
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git \
          proton-clang

    - name: 7. Configure & Build the Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        DEFCONFIG: moonstone_defconfig
        PATH: ${{ github.workspace }}/proton-clang/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        KCFLAGS: "-march=armv8.2-a -O2"

      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 $DEFCONFIG

        scripts/config --file out/.config -e KSU
        scripts/config --file out/.config -d KPROBES
        scripts/config --file out/.config -d KPROBE_EVENTS
        scripts/config --file out/.config -d KSU_KPROBES_HOOK
        scripts/config --file out/.config -d KSU_KPROBE_HOOKS

        scripts/config --file out/.config -e INPUT
        scripts/config --file out/.config -e KALLSYMS
        scripts/config --file out/.config -e KALLSYMS_ALL
        scripts/config --file out/.config -e OVERLAY_FS
        scripts/config --file out/.config -e TMPFS_XATTR
        scripts/config --file out/.config -e TMPFS_POSIX_ACL
        scripts/config --file out/.config -e LTO_CLANG_THIN
        scripts/config --file out/.config -d LTO_CLANG_FULL
        scripts/config --file out/.config -d LTO_NONE

        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 olddefconfig

        grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE|CONFIG_KSU_KPROBES_HOOK|CONFIG_OVERLAY_FS|CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL)=' out/.config || true

        if grep -q '^CONFIG_KPROBES=y' out/.config; then
          echo "ERROR: CONFIG_KPROBES is still enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KPROBE_EVENTS=y' out/.config; then
          echo "ERROR: CONFIG_KPROBE_EVENTS is still enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config; then
          echo "ERROR: CONFIG_KSU_KPROBES_HOOK is still enabled."
          exit 1
        fi

        if grep -q '^CONFIG_KSU_KPROBE_HOOKS=y' out/.config; then
          echo "ERROR: CONFIG_KSU_KPROBE_HOOKS is still enabled."
          exit 1
        fi

        if ! grep -q '^CONFIG_KSU=y' out/.config; then
          echo "ERROR: CONFIG_KSU=y was not enabled."
          exit 1
        fi

        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

    - name: 8. Package with AnyKernel3
      run: |
        git clone \
          https://github.com/Gu11e/AnyKernel3-POCOX5.git \
          AnyKernel3

        cp out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3

        ZIP_MSG="Kernel moonstone with KernelSU-Next Manual Hooks by ${{ github.actor }}"

        sed -i \
          "s/kernel.string=.*/kernel.string=$ZIP_MSG/g" \
          anykernel.sh

        if ! grep -q '^device.name2=gemstone$' anykernel.sh; then
          sed -i \
            '/^device.name1=moonstone$/a device.name2=gemstone' \
            anykernel.sh
        fi

        zip -r9 \
          ../POCOX5-KernelSU-Next.zip \
          * \
          -x .git README.md *placeholder

    - name: 9. Validate ZIP
      run: |
        test -f POCOX5-KernelSU-Next.zip

        unzip -l POCOX5-KernelSU-Next.zip
        unzip -t POCOX5-KernelSU-Next.zip

        unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "Image"
        unzip -Z1 POCOX5-KernelSU-Next.zip | grep -Fx "anykernel.sh"

        unzip -p POCOX5-KernelSU-Next.zip anykernel.sh | grep -E '^device.name[0-9]*=|^do.devicecheck='

    - name: 10. Generate Build Version
      id: version
      run: |
        BUILD_DATE="$(git show -s --date=format:'%Y.%m.%d' --format='%cd' HEAD)"
        SHORT_SHA="$(git rev-parse --short=7 HEAD)"
        VERSION="v${BUILD_DATE}-${SHORT_SHA}"

        echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
        echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

        echo "Version: ${VERSION}"
        echo "Commit:  $(git rev-parse HEAD)"

    - name: 11. Rename Release Files
      run: |
        mv \
          POCOX5-KernelSU-Next.zip \
          "POCOX5-KernelSU-Next-${VERSION}.zip"

        sha256sum \
          "POCOX5-KernelSU-Next-${VERSION}.zip" \
          > "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

        cat \
          "POCOX5-KernelSU-Next-${VERSION}.zip.sha256"

    - name: 12. Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "POCOX5-KernelSU-Next-${{ env.VERSION }}"
        path: |
          POCOX5-KernelSU-Next-${{ env.VERSION }}.zip
          POCOX5-KernelSU-Next-${{ env.VERSION }}.zip.sha256
        retention-days: 14

    - name: 13. Create GitHub Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}

      run: |
        gh release create "${VERSION}" \
          "POCOX5-KernelSU-Next-${VERSION}.zip" \
          "POCOX5-KernelSU-Next-${VERSION}.zip.sha256" \
          --target "${GITHUB_SHA}" \
          --title "POCO X5 KernelSU-Next ${VERSION}" \
          --notes "Automated kernel build.

        Device: POCO X5 5G (moonstone)
        KernelSU-Next: legacy / manual hooks
        Kprobes: disabled
        crDroid Recovery codename: gemstone
        Commit: ${GITHUB_SHA}

        SHA-256:
        $(cat "POCOX5-KernelSU-Next-${VERSION}.zip.sha256")"
